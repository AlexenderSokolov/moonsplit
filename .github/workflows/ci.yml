name: ci

on:
  push:
  pull_request:

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          # This is the compiler version used by the v0.3.0 local acceptance run.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.10.12+1634b282e
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify pinned MoonBit compiler
        run: |
          moon version --all
          moon version --all | grep -F "moonc v0.10.12+1634b282e"
      - name: Sync registry
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Public interface
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Typecheck
        run: moon check --deny-warn
      - name: Build
        run: moon build --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Test JS target
        run: moon test --target js --deny-warn
      - name: End-to-end acceptance
        run: bash ./run_acceptance.sh
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonsplit-acceptance-evidence
          path: |
            artifacts/acceptance_*
            artifacts/check_*
          if-no-files-found: warn
