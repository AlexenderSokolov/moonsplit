name: ci

on:
  push:
  pull_request:

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.1.20260703
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Format
        run: moon fmt --check
      - name: Public interface
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Typecheck
        run: moon check
      - name: Build
        run: moon build
      - name: Test
        run: moon test
      - name: Test JS target
        run: moon test --target js
      - name: End-to-end checks
        run: ./run_check.sh
